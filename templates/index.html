<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hodiny – čas serveru</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%230d1119' stroke='%23f5f7fb' stroke-width='4'/%3E%3Cpath d='M32 32V16M32 32l11 7' stroke='%23f5f7fb' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="stage">
    <div class="clock" role="img" aria-label="Analogové hodiny zobrazující čas serveru">
      <div class="bezel"></div>
      <div class="face">
        {% for i in range(60) %}
        <span class="tick{% if i % 5 == 0 %} tick--major{% endif %}" style="--i: {{ i }}"></span>
        {% endfor %}

        <div class="numerals">
          {% for n in range(1, 13) %}
          <span class="numeral" style="--n: {{ n }}">{{ n }}</span>
          {% endfor %}
        </div>

        <div class="hands">
          <div class="hand hand--hour" id="hand-hour" style="--angle: {{ state.angles.hour }}deg"></div>
          <div class="hand hand--minute" id="hand-minute" style="--angle: {{ state.angles.minute }}deg"></div>
          <div class="hand hand--second" id="hand-second" style="--angle: {{ state.angles.second }}deg"></div>
          <div class="cap"></div>
        </div>
      </div>
    </div>

    <div class="readout">
      <div class="time" id="time-text">{{ "%02d:%02d:%02d" | format(state.hour, state.minute, state.second) }}</div>
      <div class="meta">
        <span id="date-text">{{ state.date }}</span>
        <span id="tz-text">{{ state.timezone }}</span>
      </div>
      <div class="status" id="status" data-state="wait"><span>čekám na server</span></div>
    </div>
  </main>

  <script id="bootstrap" type="application/json">{{ state | tojson }}</script>
  <script src="{{ url_for('static', filename='clock.js') }}"></script>
</body>
</html>
